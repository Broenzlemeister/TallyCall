name: CI und Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in server.js lib/*.js public/*.js; do node --check "$f"; done
      - name: Übersetzungen (Vollständigkeit, Platzhalter)
        run: node tools/i18n-check.js
      - name: Rauchtest (Konten, Rollen, Freigaben, Seiten)
        run: node tools/smoke.js

  deploy:
    name: Deployment auf das VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Zugangsdaten prüfen
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::VPS_HOST oder VPS_SSH_KEY fehlt. Deployment übersprungen (siehe docs/DEPLOY.md)."; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: SSH vorbereiten
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; echo "::warning::VPS_KNOWN_HOSTS ist nicht gesetzt. Der Server-Fingerabdruck wurde beim ersten Kontakt übernommen. Besser fest hinterlegen."; fi
      - name: Server aktualisieren (git pull + Neubau auf dem Server)
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
          USER_NAME: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes -o IdentitiesOnly=yes "${USER_NAME:-deploy}@${HOST}" tallycall-update
      - name: Öffentliche Erreichbarkeit prüfen
        if: steps.cfg.outputs.ready == 'true'
        run: |
          URL="${{ vars.PUBLIC_URL || 'https://tallycall.com' }}"
          for i in $(seq 1 12); do
            if curl -fsS -m 10 "$URL/api/health" | grep -q '"ok":true'; then echo "Erreichbar: $URL"; exit 0; fi
            sleep 10
          done
          echo "::warning::$URL antwortet nicht. DNS (A-Record für @ und www), Firewall 80/443 und das Zertifikat prüfen (docker compose logs caddy)."
