<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css"><title>Timeline</title></head>
<body>
<header id="appbar"></header>
<div class="wrap" id="wrap">
  <div class="tlbar">
    <select id="daySel" style="width:auto;min-width:200px" aria-label="Tag"></select>
    <span class="seg" role="group" aria-label="Modus"><button id="mG" aria-pressed="true">Gewerke</button><button id="mD" aria-pressed="false">Alle Tage</button></span>
    <span class="seg" role="group" aria-label="Zoom"><button id="zOut" title="Verkleinern">−</button><button id="zFit">Einpassen</button><button id="zIn" title="Vergrößern">+</button></span>
    <button id="bNow" class="sm">Zu „Jetzt“</button>
    <label class="sw"><input type="checkbox" id="follow" checked> Folgen</label>
    <span style="flex:1"></span>
    <span id="editBox" class="row2" hidden><span class="hint" id="editHint"></span><button id="bEdit">✎ Bearbeiten</button></span>
  </div>
  <div id="tl"></div>
  <div class="row2 hint" style="margin-top:10px;gap:18px">
    <span><b style="color:var(--fg2)">Balken</b> = Plan · gefüllter Teil = abgelaufen</span><span>◆ Cue (Gewerke-Spur)</span><span style="color:var(--stop)">▌ Jetzt</span><span>Schraffiert = Überschneidung mit festem Start</span><span>Strg + Mausrad = Zoom</span>
  </div>
  <div class="card" id="detail" style="margin-top:14px" hidden></div>
</div>
<script src="/i18n.js"></script><script src="/shared.js"></script><script src="/common.js"></script><script src="/ui.js"></script><script src="/timeline.js"></script>
<script>
const $ = (i) => document.getElementById(i), E = CL.esc;
const isMember = CL.ctx.kind === "project" || CL.ctx.kind === "demo";
let editing = isMember && CL.params.get("edit") === "1";
const isShare = CL.ctx.kind === "share";
if (isMember) UI.bar("timeline"); else UI.floating("timeline");
if (isShare) document.getElementById("appbar").remove();
const tl = Timeline.create($("tl"), { mode: CL.params.get("mode") === "days" ? "days" : "gewerke", editable: editing, onAction: (a) => CL.api(a).catch((e) => e.message !== "abgebrochen" && UI.toast(e.message, true)), onSelect: (sel) => { selection = sel; renderDetail(); } });
let selection = null, lastDetail = "";
// Zustand in der Adresse mitführen (ohne Neuladen), damit Links und Neuladen denselben Stand zeigen
const setParam = (k, v) => { v == null ? CL.params.delete(k) : CL.params.set(k, v); try { history.replaceState(null, "", "?" + CL.params.toString()); } catch (_) {} };
$("daySel").onchange = () => { setParam("day", $("daySel").value); CL.refresh(); };
const setMode = (m) => { tl.setMode(m); $("mG").setAttribute("aria-pressed", m === "gewerke"); $("mD").setAttribute("aria-pressed", m === "days"); $("daySel").disabled = m === "days"; };
$("mG").onclick = () => { setParam("mode", null); setMode("gewerke"); }; $("mD").onclick = () => { setParam("mode", "days"); setMode("days"); }; setMode(CL.params.get("mode") === "days" ? "days" : "gewerke");
$("zIn").onclick = () => tl.setZoom(tl.zoom * 1.4); $("zOut").onclick = () => tl.setZoom(tl.zoom / 1.4); $("zFit").onclick = () => tl.fit();
$("bNow").onclick = () => tl.scrollToNow(); $("follow").onchange = () => tl.setFollow($("follow").checked);
function paintEdit() { $("bEdit").textContent = editing ? "✓ Bearbeiten beenden" : "✎ Bearbeiten (Vorschau-Modus)"; $("editHint").textContent = editing ? "Balkenende ziehen = Dauer, ◆ ziehen = Cue-Zeit. Änderungen gehen in den Entwurf, live schalten unter Planung." : ""; }
$("bEdit").onclick = async () => {
  if (!editing && !CL.state.hasDraft) { try { await CL.api({ type: "draftStart" }); } catch (e) { return UI.toast(e.message, true); } }
  editing = !editing; setParam("edit", editing ? "1" : null); setParam("preview", editing ? "1" : null);
  tl.setEditable(editing); await CL.refresh(); paintEdit();
};
if (isMember) { $("editBox").hidden = false; paintEdit(); }
if (editing) CL.params.set("preview", "1");

function renderDetail() {
  const s = CL.state, box = $("detail");
  if (!selection || !s) { box.hidden = true; lastDetail = ""; return; }
  const f = CL.find(selection.eventId, s); if (!f) { box.hidden = true; return; }
  const e = f.e, row = CLS.schedule(f.day).find((r) => r.e.id === e.id);
  const html = `<h3 translate="no">${E(e.title)}</h3><div class="row2" style="gap:18px"><span class="mono">${CL.hhmm(row.start)}–${CL.hhmm(row.end)}</span><span class="mono mute">${CL.fmtDur(e.duration)}</span>${e.presenter ? `<span class="fg2" translate="no">${E(e.presenter)}</span>` : ""}${e.start === "fixed" ? '<span class="badge">📌 feste Uhrzeit</span>' : ""}</div>
    ${e.note ? `<p class="fg2" translate="no">${E(e.note)}</p>` : ""}
    <div style="margin-top:8px">${[...e.cues].sort((a, b) => a.offset - b.offset).map((c) => { const g = CL.gewerk(c.gewerk, s); return `<div class="cue" style="--c:${E(g?.color || "#94a3b8")}"><span class="when">+${CL.fmt(c.offset * 1000)}</span><span class="chip" style="--c:${E(g?.color || "#94a3b8")}">${E(g?.short || "–")}</span><span translate="no">${E(c.text)}</span><span></span></div>`; }).join("") || '<p class="hint">Keine Cues.</p>'}</div>`;
  if (html !== lastDetail) { box.innerHTML = html; lastDetail = html; } box.hidden = false;
}
CL.run((s) => {
  const day = CL.viewDay(s);
  const opts = s.days.map((d) => `<option translate="no" value="${E(d.id)}"${d.id === day.id ? " selected" : ""}>${E(d.name)} · ${E(d.date.split("-").reverse().join("."))}</option>`).join("");
  if ($("daySel").dataset.h !== opts) { $("daySel").dataset.h = opts; $("daySel").innerHTML = opts; }
  tl.render(s); renderDetail();
});
</script></body></html>
