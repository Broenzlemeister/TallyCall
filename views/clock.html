<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/app.css"><title>Uhr</title></head>
<body class="view"><div class="center"><div class="bigtime" id="t" style="font-size:min(20vw,36vh)"></div><div class="sub" id="d"></div></div>
<script src="/i18n.js"></script><script src="/shared.js"></script><script src="/common.js"></script><script src="/ui.js"></script>
<script>
const $ = (i) => document.getElementById(i);
UI.floating("clock");
CL.run((s) => { const c = CL.clock(s);
  $("t").textContent = CL.hhmmss(c.sec);
  $("d").textContent = new Date(c.date + "T12:00:00Z").toLocaleDateString(I18N.locale, { weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }) + " · " + s.settings.timezone; });
</script></body></html>
